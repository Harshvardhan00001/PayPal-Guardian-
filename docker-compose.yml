version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    restart: always
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_secret_password
      POSTGRES_DB: guardian_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: guardian-server
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://guardian:guardian_secret_password@postgres:5432/guardian_db?schema=public
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-mock_client_id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-mock_client_secret}
      PAYPAL_MODE: ${PAYPAL_MODE:-mock}
    ports:
      - '4000:4000'

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: guardian-client
    restart: always
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  pgdata:
